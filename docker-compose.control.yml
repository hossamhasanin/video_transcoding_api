version: "3.8"

services:
  traefik:
    image: traefik:v3.0
    container_name: traefik
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # ==========================================================
      # UNCOMMENT THESE LINES LATER FOR SSL (Let's Encrypt)
      # ==========================================================
      # - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      # - "--certificatesresolvers.myresolver.acme.email=${SSL_EMAIL:-your-email@example.com}"
      # - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      # - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      # - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik-certs:/letsencrypt"
    restart: always

  db:
    image: postgres:15-alpine
    container_name: transcoding-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepassword}
      POSTGRES_DB: transcoding_db
    ports:
      - "${BIND_IP:-0.0.0.0}:5432:5432" # Bind to Tailscale IP in production!
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: transcoding-redis
    ports:
      - "${BIND_IP:-0.0.0.0}:6379:6379" # Bind to Tailscale IP in production!
    restart: always

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: transcoding-api
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-securepassword}@db:5432/transcoding_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    labels:
      - "traefik.enable=true"
      # The rule matches your IP or Domain, and specifically the API routes (and docs)
      - "traefik.http.routers.api.rule=Host(`${DOMAIN:-localhost}`) && (PathPrefix(`/api`) || PathPrefix(`/docs`) || PathPrefix(`/openapi.json`))"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
      # ==========================================================
      # LATER FOR SSL: Change 'web' to 'websecure' and uncomment certresolver
      # ==========================================================
      - "traefik.http.routers.api.entrypoints=web"
      # - "traefik.http.routers.api.tls.certresolver=myresolver"
    depends_on:
      - db
      - redis
    restart: always

  frontend:
    build:
      context: ./frontend
    container_name: transcoding-frontend
    labels:
      - "traefik.enable=true"
      # A simple catch-all for the frontend if it's on the domain/IP
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN:-localhost}`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      # ==========================================================
      # LATER FOR SSL: Change 'web' to 'websecure' and uncomment certresolver
      # ==========================================================
      - "traefik.http.routers.frontend.entrypoints=web"
      # - "traefik.http.routers.frontend.tls.certresolver=myresolver"
    depends_on:
      - api
    restart: always

volumes:
  pgdata:
  traefik-certs:
