version: "3.8"

services:
  worker-ml:
    build:
      context: ./backend
      dockerfile: Dockerfile.ml
    container_name: transcoding-worker-ml
    # Enable NVIDIA runtime if this VPS has a GPU installed
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-changeme}@${CONTROL_PLANE_IP:-host.docker.internal}:5432/transcoding_db
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-changeme}@${CONTROL_PLANE_IP:-host.docker.internal}:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-changeme}@${CONTROL_PLANE_IP:-host.docker.internal}:6379/0
      - API_BASE_URL=${API_BASE_URL:-http://localhost:8000}
    restart: always
