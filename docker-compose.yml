version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: transcoding-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: transcoding_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: transcoding-redis
    ports:
      - "6379:6379"
    restart: always

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: transcoding-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@db:5432/transcoding_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # Add S3/R2 keys here for local testing or map an .env file
      # - R2_ACCOUNT_ID=...
      # - R2_ACCESS_KEY_ID=...
      # - R2_SECRET_ACCESS_KEY=...
      # - R2_BUCKET_NAME=...
      # - S3_ENDPOINT_URL=...
    depends_on:
      - db
      - redis
    restart: always

  frontend:
    build:
      context: ./frontend
    container_name: transcoding-frontend
    ports:
      - "80:80"
    depends_on:
      - api
    restart: always

  worker-transcode:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: transcoding-worker
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@db:5432/transcoding_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # Provide keys via .env in production
    depends_on:
      - db
      - redis
    restart: always

  worker-ml:
    build:
      context: ./backend
      dockerfile: Dockerfile.ml
    container_name: transcoding-worker-ml
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@db:5432/transcoding_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # Provide keys via .env in production
    depends_on:
      - db
      - redis
    restart: always

volumes:
  pgdata:
