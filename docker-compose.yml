version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: transcoding-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: transcoding_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: transcoding-redis
    ports:
      - "6379:6379"
    restart: always

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: transcoding-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@db:5432/transcoding_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # Provide R2/S3 keys via .env in production
    depends_on:
      - db
      - redis
    restart: always

volumes:
  pgdata:
