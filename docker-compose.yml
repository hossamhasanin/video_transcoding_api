version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: transcoding-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adminpassword}
      POSTGRES_DB: transcoding_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: transcoding-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:6379:6379"
    restart: always

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: transcoding-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-adminpassword}@db:5432/transcoding_db
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
    depends_on:
      - db
      - redis
    restart: always

  worker-transcode:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: transcoding-worker
    profiles:
      - worker
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-adminpassword}@db:5432/transcoding_db
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - API_BASE_URL=${API_BASE_URL:-http://localhost:8000}
    depends_on:
      - db
      - redis
    restart: always

  worker-ml:
    build:
      context: ./backend
      dockerfile: Dockerfile.ml
    container_name: transcoding-worker-ml
    profiles:
      - ml
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-adminpassword}@db:5432/transcoding_db
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - API_BASE_URL=${API_BASE_URL:-http://localhost:8000}
    depends_on:
      - db
      - redis
    restart: always

volumes:
  pgdata:
