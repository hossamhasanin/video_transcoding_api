name: CD - Deploy to Production

on:
  workflow_run:
    workflows: ["CI - Lint, Test & Build"]
    branches: [main]
    types: 
      - completed

env:
  DEPLOY_PATH: ~/transcoding-app
  COMPOSE_FILE: docker-compose.control.yml

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Navigate to project directory
            cd ${{ env.DEPLOY_PATH }}
            
            # Pull latest changes
            echo "📥 Pulling latest changes..."
            git pull origin main
            
            # Copy environment file if it doesn't exist
            if [ ! -f .env ]; then
              echo "⚠️  No .env file found. Please create one from .env.example"
              exit 1
            fi
            
            # Copy .env to backend directory
            echo "📋 Setting up environment..."
            cp .env backend/.env
            
            # Build and restart services
            echo "🔨 Building and restarting services..."
            sudo docker compose -f ${{ env.COMPOSE_FILE }} up -d --build
            
            # Wait for services to start
            echo "⏳ Waiting for services to start..."
            sleep 15
            
            # Run database migrations
            echo "🗄️  Running database migrations..."
            sudo docker compose -f ${{ env.COMPOSE_FILE }} exec -T api alembic upgrade head || echo "⚠️  Migration may have already been applied"
            
            # Health check - API
            echo "🏥 Performing health checks..."
            for i in {1..5}; do
              if curl -f http://localhost:8000/health > /dev/null 2>&1; then
                echo "✅ API is healthy"
                break
              else
                echo "⏳ Waiting for API to be ready... (attempt $i/5)"
                sleep 10
              fi
            done
            
            # Health check - Frontend
            for i in {1..5}; do
              if curl -f http://localhost > /dev/null 2>&1; then
                echo "✅ Frontend is healthy"
                break
              else
                echo "⏳ Waiting for frontend to be ready... (attempt $i/5)"
                sleep 10
              fi
            done
            
            # Show running containers
            echo "📦 Running containers:"
            sudo docker compose -f ${{ env.COMPOSE_FILE }} ps
            
            echo "✅ Deployment completed successfully!"

      - name: Send deployment notification
        if: success()
        run: |
          echo "🚀 Deployment to production completed successfully!"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.actor }}"
          
          # You can add Slack/Discord/Telegram notification here
          # For example, using curl to send to a webhook

      - name: Send failure notification
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.actor }}"
          
          # You can add failure notification here