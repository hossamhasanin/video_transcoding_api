name: CD - Deploy to Production

on:
  workflow_run:
    workflows: ["CI - Lint, Test & Build"]
    branches: [main]
    types: 
      - completed

env:
  DEPLOY_PATH: ~/transcoding-app

jobs:
  # ===========================================
  # CHECK: Verify secrets are configured
  # ===========================================
  check-secrets:
    name: Check Secrets Configured
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      secrets-configured: ${{ steps.check.outputs.configured }}
    
    steps:
      - name: Check if deployment secrets exist
        id: check
        run: |
          if [[ -z "${{ secrets.CONTROL_VPS_HOST }}" ]]; then
            echo "⚠️  Deployment secrets not configured yet."
            echo ""
            echo "📋 To enable auto-deployment, add these secrets in GitHub:"
            echo "   Repo → Settings → Secrets and variables → Actions"
            echo ""
            echo "   Required secrets:"
            echo "   - CONTROL_VPS_HOST"
            echo "   - CONTROL_VPS_USERNAME"
            echo "   - CONTROL_VPS_SSH_KEY"
            echo "   - WORKER_VPS_HOST"
            echo "   - WORKER_VPS_USERNAME"
            echo "   - WORKER_VPS_SSH_KEY"
            echo "   - ML_VPS_HOST"
            echo "   - ML_VPS_USERNAME"
            echo "   - ML_VPS_SSH_KEY"
            echo ""
            echo "📖 See DEPLOYMENT_GUIDE.md for full setup instructions."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Secrets are configured."
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

  # ===========================================
  # CONTROL PLANE (VPS 1) - API + Frontend + DB + Redis
  # ===========================================
  deploy-control:
    name: Deploy Control Plane
    runs-on: ubuntu-latest
    needs: check-secrets
    if: ${{ needs.check-secrets.outputs.secrets-configured == 'true' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Control Plane via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CONTROL_VPS_HOST }}
          username: ${{ secrets.CONTROL_VPS_USERNAME }}
          key: ${{ secrets.CONTROL_VPS_SSH_KEY }}
          port: ${{ secrets.CONTROL_VPS_PORT || 22 }}
          script: |
            cd ${{ env.DEPLOY_PATH }}
            
            echo "📥 Pulling latest changes..."
            git pull origin main
            
            if [ ! -f .env ]; then
              echo "❌ No .env file found!"
              exit 1
            fi
            
            echo "📋 Setting up environment..."
            cp .env backend/.env
            
            echo "🔨 Building and restarting Control Plane..."
            sudo docker compose -f docker-compose.control.yml up -d --build
            
            echo "⏳ Waiting for services to start..."
            sleep 15
            
            echo "🗄️  Running database migrations..."
            sudo docker compose -f docker-compose.control.yml exec -T api alembic upgrade head || echo "⚠️  Migration may have already been applied"
            
            echo "🏥 Health checks..."
            for i in {1..5}; do
              if curl -f http://localhost:8000/health > /dev/null 2>&1; then
                echo "✅ API is healthy"
                break
              else
                echo "⏳ Waiting for API... (attempt $i/5)"
                sleep 10
              fi
            done
            
            for i in {1..5}; do
              if curl -f http://localhost > /dev/null 2>&1; then
                echo "✅ Frontend is healthy"
                break
              else
                echo "⏳ Waiting for frontend... (attempt $i/5)"
                sleep 10
              fi
            done
            
            echo "📦 Running containers:"
            sudo docker compose -f docker-compose.control.yml ps
            
            echo "✅ Control Plane deployed!"

  # ===========================================
  # TRANSCODE WORKER (VPS 2) - FFmpeg tasks
  # ===========================================
  deploy-worker:
    name: Deploy Transcode Worker
    runs-on: ubuntu-latest
    needs: check-secrets
    if: ${{ needs.check-secrets.outputs.secrets-configured == 'true' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Worker via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.WORKER_VPS_HOST }}
          username: ${{ secrets.WORKER_VPS_USERNAME }}
          key: ${{ secrets.WORKER_VPS_SSH_KEY }}
          port: ${{ secrets.WORKER_VPS_PORT || 22 }}
          script: |
            cd ${{ env.DEPLOY_PATH }}
            
            echo "📥 Pulling latest changes..."
            git pull origin main
            
            if [ ! -f .env ]; then
              echo "❌ No .env file found!"
              exit 1
            fi
            
            echo "📋 Setting up environment..."
            cp .env backend/.env
            
            echo "🔨 Building and restarting Transcode Worker..."
            sudo docker compose -f docker-compose.worker.yml up -d --build
            
            echo "⏳ Waiting for worker to start..."
            sleep 10
            
            echo "📦 Running containers:"
            sudo docker compose -f docker-compose.worker.yml ps
            
            echo "✅ Transcode Worker deployed!"

  # ===========================================
  # ML WORKER (VPS 3) - WhisperX subtitle generation
  # ===========================================
  deploy-ml:
    name: Deploy ML Worker
    runs-on: ubuntu-latest
    needs: check-secrets
    if: ${{ needs.check-secrets.outputs.secrets-configured == 'true' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy ML Worker via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ML_VPS_HOST }}
          username: ${{ secrets.ML_VPS_USERNAME }}
          key: ${{ secrets.ML_VPS_SSH_KEY }}
          port: ${{ secrets.ML_VPS_PORT || 22 }}
          script: |
            cd ${{ env.DEPLOY_PATH }}
            
            echo "📥 Pulling latest changes..."
            git pull origin main
            
            if [ ! -f .env ]; then
              echo "❌ No .env file found!"
              exit 1
            fi
            
            echo "📋 Setting up environment..."
            cp .env backend/.env
            
            echo "🔨 Building and restarting ML Worker..."
            sudo docker compose -f docker-compose.ml.yml up -d --build
            
            echo "⏳ Waiting for worker to start..."
            sleep 10
            
            echo "📦 Running containers:"
            sudo docker compose -f docker-compose.ml.yml ps
            
            echo "✅ ML Worker deployed!"

  # ===========================================
  # DEPLOYMENT SUMMARY
  # ===========================================
  notify:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [check-secrets, deploy-control, deploy-worker, deploy-ml]
    if: always()
    
    steps:
      - name: Check deployment status
        run: |
          echo "📊 Deployment Summary"
          echo "===================="
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.actor }}"
          echo ""
          
          if [[ "${{ needs.check-secrets.outputs.secrets-configured }}" != "true" ]]; then
            echo "⚠️  Skipped: Deployment secrets not configured."
            echo ""
            echo "📖 See DEPLOYMENT_GUIDE.md for setup instructions."
            exit 0
          fi
          
          echo "Results:"
          echo "  Control Plane: ${{ needs.deploy-control.result }}"
          echo "  Transcode Worker: ${{ needs.deploy-worker.result }}"
          echo "  ML Worker: ${{ needs.deploy-ml.result }}"
          
          if [[ "${{ needs.deploy-control.result }}" == "success" && \
                "${{ needs.deploy-worker.result }}" == "success" && \
                "${{ needs.deploy-ml.result }}" == "success" ]]; then
            echo ""
            echo "✅ All deployments successful!"
          else
            echo ""
            echo "⚠️  Some deployments failed. Check logs above."
          fi